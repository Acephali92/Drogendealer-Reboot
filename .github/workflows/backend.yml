# Backend CI (Agent 3). One workflow file per area (ADR-009).
name: backend

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: drogen
          POSTGRES_PASSWORD: drogen
          POSTGRES_DB: drogendealer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drogen -d drogendealer"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://drogen:drogen@localhost:5432/drogendealer?schema=public
      TEST_DATABASE_URL: postgresql://drogen:drogen@localhost:5432/drogendealer_test?schema=public
      SHADOW_DATABASE_URL: postgresql://drogen:drogen@localhost:5432/drogendealer_shadow?schema=public
      # CI-only value, no real secret.
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create test and shadow databases
        env:
          PGPASSWORD: drogen
        run: |
          psql -h localhost -U drogen -d drogendealer -c 'CREATE DATABASE drogendealer_test;'
          psql -h localhost -U drogen -d drogendealer -c 'CREATE DATABASE drogendealer_shadow;'

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Schema drift (migrations vs. schema.prisma)
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL"
          --exit-code

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build
