name: Game-Design-Prüfung

on:
  # push nur auf main; Arbeits-Branches werden über den PR-Lauf geprüft (ADR-024)
  push:
    branches: [main]
    paths:
      - "docs/game-design/**"
      - ".github/workflows/design-check.yml"
  pull_request:
    paths:
      - "docs/game-design/**"
      - ".github/workflows/design-check.yml"

concurrency:
  group: design-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Formeln, Beispielrechnungen und Invarianten prüfen
        run: python docs/game-design/tools/verify.py
