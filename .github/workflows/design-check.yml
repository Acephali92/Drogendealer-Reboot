name: Game-Design-Prüfung

on:
  push:
    paths:
      - "docs/game-design/**"
      - ".github/workflows/design-check.yml"
  pull_request:
    paths:
      - "docs/game-design/**"
      - ".github/workflows/design-check.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Formeln, Beispielrechnungen und Invarianten prüfen
        run: python docs/game-design/tools/verify.py
