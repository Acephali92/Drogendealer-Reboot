# =============================================================================
# Drogendealer-Reboot – zentrale Spielparameter (Single Source of Truth)
# =============================================================================
# Konventionen (siehe README.md):
#   * Geldbeträge sind IMMER Integer in Cent (ct). 100 ct = 1,00 €.
#   * Raten ohne Zusatz gelten PRO TICK. 1 Tick = 10 Minuten, 144 Ticks = 1 Tag.
#   * Wahrscheinlichkeiten sind Floats in [0, 1].
#   * Bevölkerung (`pop`) in Tausend Einwohnern.
#   * Distanzen auf der Erde in km, im Weltraum in Tausend km (Tkm).
# Jeder Wert wird von docs/game-design/tools/verify.py gelesen und geprüft.
# =============================================================================

[meta]
version = "0.1.0"
tick_minutes = 10
ticks_per_day = 144
currency = "EUR"

[player]
start_cash_black = 200_000        # 2 000 € Schwarzgeld zum Start
start_cash_white = 0
backpack_capacity = 60            # Volumeneinheiten ohne Fahrzeug
hp_max = 100

[heat]
max = 100.0                       # Heat pro (Spieler, Stadt) in [0, 100]
decay_base = 0.01                 # Grundzerfall pro Tick
police_decay_damping = 0.5        # Polizei bremst den Zerfall
trade_heat_per_keur = 0.5         # Heat pro 1 000 € Handelsvolumen × Heat-Faktor der Ware

# -----------------------------------------------------------------------------
# Wirtschaft
# -----------------------------------------------------------------------------
[economy]
elasticity = 0.5                  # ε: Preiselastizität bzgl. Knappheit
wealth_price_exponent = 0.3       # ω: Wohlstand hebt das Preisniveau
cover_ticks = 144                 # Lager reicht im Gleichgewicht für 1 Tag Nachfrage
reversion_rate = 0.02             # λ: Rückkehr des Bestands zum Ziel pro Tick
noise_rho = 0.95                  # ρ: Autokorrelation des Preisrauschens
price_min_factor = 0.25           # P_min = 0,25 · P_base
price_max_factor = 4.0            # P_max = 4,00 · P_base
min_stock = 1.0                   # Bestand fällt nie unter 1 Einheit

[cities]
demand_wealth_exponent = 1.0      # β: reiche Städte konsumieren mehr

