services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drogen
      POSTGRES_PASSWORD: drogen
      POSTGRES_DB: drogendealer
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/prisma/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drogen -d drogendealer"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
